name: Validate or Publish Stable Package

# Release creation/publication and tag pushes never upload packages.
# Manual Twine is the default. Upload dispatch needs separate approval and
# externally configured release environment protections + PyPI trusted publisher.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing bare annotated stable tag, for example 1.0.0'
        required: true
        type: string
      publish:
        description: 'Upload to PyPI (separate authorization; do not use after a Twine upload)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stable-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Poetry and locked validation tools
        run: |
          python -m pip install 'poetry==2.4.2'
          poetry install --with dev --no-interaction
          poetry check --lock --strict
      - name: Check annotated tag, main ancestry and version agreement
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          RELEASE_COMMIT=$(poetry run python .github/scripts/check_release.py)
          printf 'commit=%s\n' "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  tests:
    needs: preflight
    uses: ./.github/workflows/test.yml
    with:
      release_ref: ${{ needs.preflight.outputs.commit }}

  build:
    needs: [preflight, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked tools
        run: |
          python -m pip install 'poetry==2.4.2'
          poetry install --with dev,docs --no-interaction
          poetry check --lock --strict
      - name: Check documentation
        run: |
          poetry run sphinx-build -W --keep-going -E -a -b html docs docs/_build/html
          poetry run python .github/scripts/check_docs.py docs/_build/html
      - name: Build, inspect and independently install exact candidates
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: poetry run python .github/scripts/check_artifacts.py --output-dir dist --expected-version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: stable-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: stable-distributions
          path: dist
      - name: Verify hashes and isolate upload files
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          mkdir upload
          mv -- *.whl *.tar.gz upload/
      - name: Publish through separately configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/upload/
