name: Test

on:
  push:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - .readthedocs.yaml
      - .env.example
      - dev/**
      - docs/**
      - examples/**
      - .github/ISSUE_TEMPLATE/**
      - .gemini/**
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - .readthedocs.yaml
      - .env.example
      - dev/**
      - docs/**
      - examples/**
      - .github/ISSUE_TEMPLATE/**
      - .gemini/**

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install 'poetry==2.4.2'
      - name: Install locked dependencies
        run: |
          poetry env use python
          poetry install --with dev --no-interaction
          poetry check --lock --strict
      - name: Check style and security
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run bandit -r src/obfuscidian
      - name: Run offline tests
        id: offline_tests
        run: poetry run coverage run -m pytest -q -ra --junitxml=test-results.xml
      - name: Report coverage even after test failures
        if: always() && steps.offline_tests.outcome != 'skipped'
        run: |
          poetry run coverage report
          poetry run coverage xml
      - name: Build and validate fresh artifacts
        run: poetry run python .github/scripts/check_artifacts.py
      - name: Retain test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14
