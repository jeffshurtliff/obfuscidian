name: Test

on:
  push:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - .readthedocs.yaml
      - .env.example
      - dev/**
      - docs/**
      - examples/**
      - .github/ISSUE_TEMPLATE/**
      - .gemini/**
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - LICENSE
      - .readthedocs.yaml
      - .env.example
      - dev/**
      - docs/**
      - examples/**
      - .github/ISSUE_TEMPLATE/**
      - .gemini/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: python -m pip install 'poetry==2.4.2'
      - name: Install locked dependencies
        run: |
          poetry env use python
          poetry install --with dev --no-interaction
          poetry check --lock --strict
      - name: Check style and security
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run bandit -r src/obfuscidian
      - name: Run offline tests and report coverage
        run: |
          poetry run coverage run -m pytest -q
          poetry run coverage report
      - name: Build and validate fresh artifacts
        shell: bash
        run: |
          CANDIDATE=$(mktemp -d)
          WHEELHOUSE=$(mktemp -d)
          poetry build --output "$CANDIDATE"
          poetry run twine check --strict "$CANDIDATE"/*
          poetry run python - "$WHEELHOUSE" <<'PYTHON'
          import subprocess
          import sys
          import tomllib
          from importlib.metadata import version
          from packaging.requirements import Requirement

          with open('pyproject.toml', 'rb') as source:
              project = tomllib.load(source)
          requirements = project['project']['dependencies'] + project['build-system']['requires']
          pinned = [f'{Requirement(item).name}=={version(Requirement(item).name)}' for item in requirements]
          subprocess.run([
              sys.executable, '-m', 'pip', 'download', '--only-binary=:all:',
              '--dest', sys.argv[1], *pinned,
          ], check=True)
          PYTHON
          poetry run pytest -q tests/integration/test_packaging.py --artifact-dir "$CANDIDATE" --wheelhouse "$WHEELHOUSE"
