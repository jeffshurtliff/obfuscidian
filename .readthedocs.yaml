# Read the Docs configuration v2:
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      # Match the repository's CI Poetry version; install from poetry.lock.
      - python -m pip install "poetry==2.4.2"
      - poetry check --lock --strict
      # Reuse the RTD environment. The docs do not import the application.
      - VIRTUAL_ENV="$READTHEDOCS_VIRTUALENV_PATH" poetry install --only docs --no-root --no-interaction

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true
