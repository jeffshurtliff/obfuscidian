[project]
name = "obfuscidian"
version = "1.0.0.dev0"
description = "Obfuscate and encrypt your Obsidian vault to create secure and private backups."
readme = "README.md"
authors = [
    { name = "Jeff Shurtliff", email = "jeff@shurt.us" }
]
maintainers = [
    { name = "Jeff Shurtliff", email = "jeff@shurt.us" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    # Project maturity
    "Development Status :: 2 - Pre-Alpha",

    # Intended audience and environment
    "Intended Audience :: End Users/Desktop",
    "Environment :: Console",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",

    # Supported Python versions
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.5.0",
    "cryptography>=50.0.2"
]

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://github.com/jeffshurtliff/obfuscidian"
Changelog = "https://github.com/jeffshurtliff/obfuscidian/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/jeffshurtliff/obfuscidian/issues"
CI = "https://github.com/jeffshurtliff/obfuscidian/actions"

[project.scripts]
obfuscidian = "obfuscidian.cli:cli"

[tool.poetry]
requires-poetry = ">=2.2,<3.0"
packages = [{ include = "obfuscidian", from = "src" }]
include = [
    { path = "poetry.lock", format = "sdist" },
    { path = "docs/CHANGELOG.md", format = "sdist" },
    { path = "docs/CONFIGURATION.md", format = "sdist" },
    { path = "docs/INVENTORY.md", format = "sdist" },
    { path = "docs/FORMAT.md", format = "sdist" },
    { path = "docs/TRANSACTIONS.md", format = "sdist" },
    { path = "docs/BACKUP.md", format = "sdist" },
    { path = "docs/VERIFY.md", format = "sdist" },
    { path = "docs/RESTORE.md", format = "sdist" },
]
# Use a small package boundary, plus explicit exclusions for private/generated content.
exclude = [
    "local", ".env", ".env.*", "*.key", "**/*.key", "scratch.txt", "**/scratch.txt",
    "tempCodeRunnerFile.py", "**/tempCodeRunnerFile.py", "**/__pycache__", "**/*.pyc",
    "**/.DS_Store", "**/._*", ".venv", "dist", "build", "docs/_build",
]

[tool.ruff]
line-length = 130
target-version = "py312"
# Historical concept scripts are reference material, outside application/test lint scope.
extend-exclude = ["dev"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Preserve the maintainer-required UTF-8 declaration in module headers.
ignore = ["UP009"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["obfuscidian"]
branch = true

[dependency-groups]
dev = [
    "pytest (>=8.4,<10)",
    "coverage (>=7.10,<8)",
    "ruff (>=0.13,<1)",
    "bandit (>=1.8,<2)",
    "twine (>=6.2,<7)",
    "poetry-core (>=2.2,<3) ; python_version >= \"3.12\" and python_version < \"4.0\""
]
